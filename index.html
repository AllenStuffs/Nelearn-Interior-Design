/* Authored lessons, keyed "module-lesson" (1-based). */
const LES={
"1-1":{obj:["Define interior design in your own words","Name the stages of the design process","Explain why design is human-centred"],
intro:"Every room you have ever used was designed, well or badly. Interior design is the discipline of shaping interior space so that people can use it safely, comfortably and meaningfully.",
secs:[["A working definition","Interior design plans and organises the inside of buildings: layout, surfaces, light, furniture and fittings. Its purpose is to support what people do in a space and how they feel there. It is a technical and creative profession, not only styling."],
["A short history","Interiors were long arranged by builders, craftspeople or owners. Interior design emerged as a separate profession in the 20th century, as buildings grew more complex and demands for safety, accessibility and comfort grew with them."],
["Human-centred design","Start with people: who uses the room, what do they do, what do they need? A reading room for children and a hospital waiting area need different light, seating and acoustics, even at the same floor area."],
["The design process","1) Brief: understand needs, budget, constraints. 2) Research and measure the site. 3) Concept: ideas, mood, planning options. 4) Development: drawings, materials, lighting. 5) Documentation: precise drawings and schedules. 6) Delivery and review on site."]],
terms:[["Brief","A written statement of client needs, goals and constraints."],["Programme","The list of activities a space must support."],["Concept","The central idea that guides design decisions."]],
app:"Look at your own bedroom. Write down three activities it supports. Is the layout helping or fighting each one?",
mist:["Treating design as decoration only","Choosing products before understanding the brief","Designing for yourself instead of the user"],

q:[["Which best describes interior design?",["Choosing paint colours","Shaping interior space to support people's activities and wellbeing","Drawing building structure","Buying furniture"],1,"Correct: it covers layout, light, materials and function. Colour and furniture are parts of it; structure belongs mainly to architecture."],
["What comes first in the design process?",["Selecting finishes","Rendering","Understanding the brief and the users","Buying furniture"],2,"The brief frames every later choice. Finishes, renders and purchases made first risk solving the wrong problem."],
["'Human-centred' design means:",["Using human-shaped furniture","Starting from users' needs and behaviour","Avoiding technology","Using only natural materials"],1,"It means the user's needs drive decisions. The other options confuse it with style or material preferences."]],
chk:"You can define interior design, list the six stages of the process, and explain why the brief comes first."},
"2-3":{obj:["Explain what scale means in drawing and in design","Judge furniture proportion against a room","Use the human body as a measuring reference"],
intro:"Scale is size relative to something else; proportion is the relationship between parts. Most rooms that 'feel wrong' have a scale or proportion problem.",
secs:[["Two meanings of scale","Drawing scale is a ratio: at 1:50, 1 cm on paper equals 50 cm in reality. Visual scale is how big an object feels relative to its surroundings and to people."],
["Human scale","Design from the body: seat height about 45 cm, dining table about 75 cm, standard door about 200 cm high, counter about 90 cm. These figures anchor furniture to comfort."],
["Proportion in rooms","A rug should usually be large enough for front legs of sofas to rest on it. A tiny rug floats; a huge sofa in a small room dominates. Leave about 90 cm for main walkways and about 45 cm between sofa and coffee table."],
["Converting scale","At 1:50, a 4 m wall is 80 mm on paper. Divide real length by the scale number to get drawing length."]],
terms:[["Scale","Size relative to a reference, or the ratio of a drawing to reality."],["Proportion","The size relationship between parts and the whole."],["Clearance","Free space left around objects for use and movement."]],
app:"Measure your sofa and the wall behind it. Is the sofa roughly two thirds of the wall length? Adjust and compare how it feels.",
mist:["Buying furniture without measuring the room and doors","Mixing drawing scale up with visual scale","Ignoring clearances"],
ex:"Draw your room at 1:50 on paper, then place cut-out furniture at the same scale. Test two layouts and check walkway widths.",
q:[["At 1:50, how long on paper is a 3 m wall?",["3 cm","6 cm","30 cm","15 cm"],1,"3 m = 300 cm; 300 / 50 = 6 cm. The others use the wrong division."],
["A good main walkway width is roughly:",["30 cm","60 cm","90 cm","3 m"],2,"About 90 cm allows comfortable passing. 30 and 60 cm are too tight; 3 m wastes space."],
["Visual scale describes:",["The drawing ratio","How large an object feels relative to its setting","The paper size","Material weight"],1,"Drawing ratio is the other meaning of scale; visual scale is perceptual."]],
chk:"You can convert real lengths to drawing lengths and check basic clearances without guessing."},
"4-1":{obj:["Identify primary, secondary and tertiary colours","Describe hue, tint, tone and shade","Build a simple harmonious palette"],
intro:"Colour sets mood faster than any other element. A structured colour wheel turns choice from guesswork into method.",
secs:[["The wheel","In traditional painting theory the primaries are red, yellow and blue. Mixing two gives secondaries (orange, green, violet). Mixing a primary with a neighbouring secondary gives tertiaries such as red-orange."],
["Hue, tint, tone, shade","Hue is the pure colour. Adding white makes a tint, grey a tone, black a shade. Interiors usually favour tints and tones, which feel calmer than pure hues."],
["Palette method","Use the 60-30-10 guide: 60% dominant (walls, large surfaces), 30% secondary (furniture, curtains), 10% accent (cushions, art). It is a starting guide, not a rule."]],
terms:[["Hue","The pure colour family, such as red or green."],["Tint","A hue lightened with white."],["Accent","A small area of strong colour."]],
app:"Pick one colour from a favourite photo. Build a 60-30-10 palette around it using a tint, a tone and one accent.",
mist:["Using too many saturated hues","Judging colour only under shop lighting","Forgetting that floors and wood add colour too"],
ex:"Draw a wheel, then make a three-colour palette for a reading corner and label the 60-30-10 split.",
q:[["Adding white to a hue creates a:",["Shade","Tint","Tone","Accent"],1,"White gives a tint; black a shade; grey a tone."],
["In 60-30-10, the 10% is:",["Walls","Floor","Accent","Ceiling"],2,"The 10% is the accent. Walls usually take the dominant 60%."],
["Which is a secondary colour?",["Red","Green","Yellow","Blue"],1,"Green is yellow plus blue. The others are primaries."]],
chk:"You can name wheel groups and build a labelled 60-30-10 palette."},
"6-3":{obj:["Explain colour temperature in kelvin","Choose warm or cool light for a function","Avoid mixing temperatures carelessly"],
intro:"Two bulbs of equal brightness can make a room feel cosy or clinical. The difference is colour temperature.",
secs:[["The kelvin scale","Colour temperature is measured in kelvin (K). Around 2700K is warm, yellowish light; 3000K is soft white; 4000K is neutral; 5000K and above is cool, bluish daylight-like light."],
["Matching light to task","Bedrooms and living rooms suit 2700-3000K. Kitchens and workspaces often suit 3500-4000K for clarity. Retail and detail work may use higher values."],
["Consistency","Mixing bulbs of very different temperatures in one view looks accidental. Choose one temperature per zone, or use dimmable tunable fittings. Also check CRI, which tells how faithfully a light shows colours."]],
terms:[["Kelvin (K)","Unit measuring light colour appearance."],["CRI","Colour Rendering Index; how accurately light shows colours."],["Warm white","Light around 2700-3000K."]],
app:"Check the bulbs in your home. Note the K value on the packaging and whether the room's use matches it.",
mist:["Thinking higher K means brighter","Using cool light in relaxing spaces","Mixing temperatures in one room"],
ex:"List five rooms and assign a kelvin range to each with a one-line reason.",
q:[["Which is warmest?",["2700K","4000K","5000K","6500K"],0,"Lower kelvin is warmer. Higher values look cooler and bluer."],
["Kelvin measures:",["Brightness","Colour appearance of light","Power use","Beam angle"],1,"Brightness is lumens, power is watts."],
["A study desk most likely suits:",["2200K","2700K","3500-4000K","1800K"],2,"Neutral light supports focus; very warm light is better for relaxing."]],
chk:"You can pick a kelvin range for any room and explain the choice."}};

"1-2":{obj:["Distinguish the three disciplines","Match a task to the right professional"],
intro:"People use architecture, interior design and decoration as synonyms. They overlap, but their scope and responsibility differ.",
secs:[["Architecture","Architecture designs the building: structure, envelope, services, and how it sits on its site. Changes here are costly and often regulated."],["Interior design","Interior design works inside that shell: planning layouts, selecting finishes, lighting, joinery and fittings, with attention to safety, accessibility and use. It may involve moving non-structural walls."],["Decoration","Decoration styles a finished space: paint, textiles, accessories, art. It is quicker and lower-risk, and rarely changes how the space works."],["Where they meet","A good project coordinates all three. Qualification and licensing rules for each differ by country, so check local requirements before hiring or practising."]],
terms:[["Building envelope","Walls, roof and floor separating inside from outside."],["Non-structural wall","A partition that carries no building load."]],
app:"Think of a cafe. List one decision for the architect, one for the interior designer and one for the decorator.",
mist:["Assuming a designer is only a decorator","Moving walls without checking whether they are structural"],
ex:"Make a three-column table of architecture, interior design and decoration. Add five decisions from a room of your choice to the correct columns.",
q:[["Which is mainly an interior design task?",["Choosing foundation depth","Planning a room layout and lighting","Selecting cushions only","Designing the roof structure"],1,"Layout and lighting are core interior tasks. Foundations and roofs are architecture; cushions alone are decoration."],
["Decoration usually:",["Changes structure","Styles a finished space","Replaces planning","Requires drawings of sections"],1,"It styles surfaces and accessories without changing function."],
["Before removing a wall you should:",["Paint it","Check if it is structural","Measure the floor tiles","Buy furniture"],1,"A load-bearing wall removed wrongly is unsafe."]],
chk:"You can sort design decisions into the three disciplines and explain why."},
"1-3":{obj:["Explain the three goals of good design","Recognise trade-offs between them"],
intro:"The Roman writer Vitruvius described good building as firm, useful and delightful. Interior designers still balance the same three concerns: function, comfort and aesthetics.",
secs:[["Function","Does the space support its activities? A kitchen needs a workable sequence between storage, preparation, cooking and cleaning."],["Comfort","Comfort covers temperature, light, acoustics, seating and ease of use. A beautiful chair that hurts after ten minutes fails."],["Aesthetics","Aesthetics is proportion, colour, material and composition. It affects mood and meaning, and should follow from the first two."],["Trade-offs","A glossy floor looks elegant but may be slippery; a tiny bathroom may favour function over decoration. Design is choosing priorities deliberately for each project."]],
terms:[["Function","How well a space supports its activities."],["Trade-off","Giving up some of one quality to gain another."]],
app:"Choose a chair you own. Rate it from 1 to 5 for function, comfort and aesthetics, and explain the lowest score.",
mist:["Putting looks ahead of use","Ignoring comfort details like seat height and noise"],
ex:"Analyse one room with a table: three strengths and three weaknesses under each of the three headings.",
q:[["Which is a comfort issue?",["Wall colour name","Echo making conversation tiring","Brand of sofa","Picture frame style"],1,"Acoustic strain affects comfort; the others are style or brand."],
["Good aesthetics should ideally:",["Override function","Follow from function and comfort","Be ignored","Depend on price"],1,"Beauty supports use rather than replacing it."],
["A slippery glossy floor in a bathroom is mainly a:",["Function and safety trade-off","Colour problem","Scale problem","Rhythm problem"],0,"It trades beauty against safety and function."]],
chk:"You can critique any room against function, comfort and aesthetics."},
"1-4":{obj:["Describe how people experience space through senses","Apply privacy and prospect-refuge ideas","Name accessibility basics"],
intro:"Rooms are experienced with the whole body: sight, sound, touch, temperature and movement. Designers predict that experience before anything is built.",
secs:[["Senses and atmosphere","Light, acoustics, surface texture and smell shape mood. Hard surfaces echo; soft surfaces absorb sound."],["Personal space and privacy","Anthropologist Edward Hall studied proxemics, the distances people keep from each other. Layouts should allow both togetherness and retreat."],["Prospect and refuge","Geographer Jay Appleton proposed that people like to see out (prospect) while feeling protected (refuge), such as a window seat or a back-to-wall chair."],["Inclusive use","Spaces should work for children, older people and wheelchair users: step-free routes, clear turning space, reachable controls and legible wayfinding."]],
terms:[["Proxemics","Study of distance and personal space."],["Wayfinding","Cues that help people navigate a building."]],
app:"Visit a cafe. Note where people choose to sit and what they can see from there.",
mist:["Designing only for able-bodied adults","Ignoring sound"],
ex:"Observe a public room for 15 minutes. Sketch where people sit and write three observations about privacy and view.",
q:[["Prospect-refuge describes:",["Seeing out while feeling sheltered","Colour matching","Floor height","Lighting power"],0,"Corners and window seats offer both."],
["Soft furnishings mainly help to:",["Raise ceilings","Absorb sound","Change colour temperature","Add structure"],1,"They reduce echo."],
["Wayfinding is:",["A paint type","Cues that guide movement","A furniture style","A drawing scale"],1,"Signs, lighting and layout cues orient people."]],
chk:"You can explain a room's experience through senses, privacy, view and access."},
"2-1":{obj:["Measure a room accurately","Record openings and heights","Check for out-of-square walls"],
intro:"Every plan depends on measurements. A mistake of a few centimetres can mean a sofa that will not pass a door.",
secs:[["Tools","A steel tape or laser measure, a notebook, pencil, and a camera. Work with a partner for long walls."],["What to record","Wall lengths, ceiling height, door and window widths and heights, window sill height, and positions of sockets, switches, columns and radiators. Use millimetres consistently."],["Method","Sketch the room roughly first, then add dimensions. Measure each wall at floor level and again higher, since walls are not always parallel."],["Checking squareness","Measure both diagonals of a rectangular room. If they differ, the room is out of square. Measure twice, record once."]],
terms:[["Sill height","Distance from floor to the bottom of a window."],["Diagonal check","Comparing diagonals to test squareness."]],
app:"Measure your bedroom and list the largest piece of furniture that can pass through its door.",
mist:["Forgetting ceiling height and openings","Mixing units","Trusting a single measurement"],
ex:"Measure a room, draw a plan at 1:50, and check both diagonals.",
q:[["Different diagonals mean the room is:",["Square","Out of square","Taller","Smaller"],1,"Equal diagonals indicate square corners."],
["Which should be recorded?",["Only wall lengths","Wall lengths, heights and openings","Only furniture","Only colour"],1,"Openings and heights govern fit and light."],
["Best practice for units is to:",["Mix cm and inches","Use one unit consistently","Round to metres","Skip units"],1,"Mixed units cause errors."]],
chk:"You can survey a room and produce a reliable dimensioned sketch."},
"3-1":{obj:["Identify symmetrical, asymmetrical and radial balance","Judge visual weight"],
intro:"Balance is the sense that a room is stable. It is about visual weight, not physical weight.",
secs:[["Symmetrical balance","Mirrored arrangements around an axis, such as matching lamps either side of a bed. It feels formal and calm."],["Asymmetrical balance","Different elements that carry equal visual weight, such as a large sofa balanced by two chairs and a tall plant. It feels relaxed and dynamic."],["Radial balance","Elements arranged around a centre, such as chairs around a round table or a chandelier."],["Visual weight","Dark colours, large size, strong texture and bright contrast feel heavier. Balance them across the room, not only left to right but top to bottom."]],
terms:[["Axis","An imaginary line that organises a composition."],["Visual weight","How strongly an element draws the eye."]],
app:"Photograph a room and draw a vertical line through the middle. Does one side feel heavier?",
mist:["Equating balance with exact matching","Putting all heavy items on one side"],
ex:"Rearrange five objects on a shelf in symmetrical, then asymmetrical balance and photograph both.",
q:[["Matching lamps beside a bed show:",["Radial balance","Symmetrical balance","Contrast","Rhythm"],1,"Mirrored pairs create symmetry."],
["Which has greater visual weight?",["Pale small vase","Dark large cabinet","Thin curtain","Light rug"],1,"Dark and large feels heavier."],
["Asymmetrical balance requires:",["Identical items","Equal visual weight from different items","One item only","No planning"],1,"Weight is matched, not shape."]],
chk:"You can name the balance type in a room and correct a lopsided layout."},
"4-2":{obj:["Distinguish warm and cool colours","Predict their effect on space"],
intro:"Warm colours feel closer and energetic, cool colours feel calmer and farther. This effect changes how large or intimate a room seems.",
secs:[["The temperature of colour","Reds, oranges and yellows are warm; blues, greens and violets are cool. Greens and violets can lean either way depending on their mix."],["Spatial effects","Warm colours advance and make large rooms cosier. Cool, light colours recede and can make small rooms feel more open."],["Light interacts","Warm bulbs deepen warm colours; cool daylight sharpens cool ones. Test samples in the room at different times."],["Neutrals","Beige and grey also have undertones. A warm grey and a cool grey can clash when placed together."]],
terms:[["Undertone","The subtle hue beneath a neutral."],["Advance and recede","How colours seem nearer or farther."]],
app:"Hold two paint samples, one warm and one cool, on the same wall at midday and evening.",
mist:["Ignoring undertones","Judging colour in shop light"],
ex:"Make two mood boards for the same room, one warm and one cool, and describe the difference.",
q:[["Which tends to recede?",["Red","Pale blue","Orange","Deep yellow"],1,"Cool light colours feel farther away."],
["A neutral grey may have:",["No hue at all","A warm or cool undertone","Only black","Only white"],1,"Undertones affect combinations."],
["To test paint you should:",["Trust the tin","View it in the room at several times","Only view at night","Skip tests"],1,"Light changes colour."]],
chk:"You can choose warm or cool colour for a room and explain the effect."},
"5-1":{obj:["Compare solid and engineered wood","Judge durability and sustainability"],
intro:"Wood is the most widely used interior material. Choosing the right kind depends on use, moisture and budget.",
secs:[["Solid wood","Cut directly from the tree. Hardwoods such as teak are dense and durable; softwoods such as pine are lighter and dent more easily. Solid wood expands and contracts with humidity, which matters in tropical climates."],["Engineered wood","Plywood layers veneers with alternating grain for stability. MDF and particleboard are made from fibres or chips bonded with resin. Veneer is a thin slice of real wood over a core."],["Choosing","Use plywood or veneered boards for large stable panels, solid wood where edges and wear show. Check moisture resistance for kitchens and bathrooms, and formaldehyde emission classes of boards."],["Sustainability","Look for certified timber, such as FSC or PEFC, and ask for the species and source."]],
terms:[["Veneer","Thin slice of wood laminated to a core."],["Grain","Direction and pattern of wood fibres."]],
app:"Find two wooden items at home. Decide whether each is solid, plywood or veneer, and why.",
mist:["Assuming engineered wood is always low quality","Ignoring humidity movement"],
ex:"Build a table comparing solid wood, plywood, MDF and veneer for cost, durability, moisture and appearance.",
q:[["Plywood is stable because:",["It is solid","Layers have alternating grain","It is metal","It has no glue"],1,"Cross-layers resist movement."],
["Veneer is:",["Paint","Thin real wood on a core","Plastic","Glass"],1,"It gives a wood face on stable board."],
["Sustainable timber is shown by:",["Price","Certification such as FSC","Colour","Weight"],1,"Certification tracks responsible sourcing."]],
chk:"You can pick a wood type for a given use and justify it."},
"6-1":{obj:["Describe daylight sources and quality","Plan openings and shading for the tropics"],
intro:"Daylight is free, changing and powerful. Good designs use it for comfort and mood, and control it where it overheats or glares.",
secs:[["Daylight sources","Direct sunlight is strong and creates sharp shadows. Diffuse skylight is softer and even. Reflected light bounces from floors and walls."],["Orientation","Near the equator, as in Indonesia, the sun is high at midday and low and harsh on east and west facades. Deep eaves, verandas and screens help."],["Window design","Large openings give more light but more heat. Higher windows bring light deeper into a room; side windows give views and cross-ventilation."],["Surfaces","Light-coloured walls and ceilings bounce daylight deeper. Dark surfaces absorb it."]],
terms:[["Diffuse light","Soft, scattered light without hard shadows."],["Eaves","The overhanging edge of a roof."]],
app:"Note where sunlight lands in your room at 9am, noon and 4pm and mark it on a plan.",
mist:["Ignoring heat gain","Assuming bigger windows are always better"],
ex:"Make a daylight study of a room with three plans (morning, noon, afternoon) showing light patches and glare.",
q:[["On east and west facades near the equator, sun is:",["High and mild","Low and harsh","Absent","Cool"],1,"Low angles cause glare and heat."],
["Light surfaces:",["Absorb daylight","Reflect it deeper","Block it","Create heat"],1,"They bounce light into the room."],
["Eaves help by:",["Increasing glare","Shading windows","Lowering ceilings","Adding colour"],1,"They shade openings from high sun and rain."]],
chk:"You can analyse the daylight in a room and suggest shading."},
"8-2":{obj:["Describe the main parts of a Joglo house","Explain how form responds to climate","Interpret spatial hierarchy"],
intro:"The Joglo is a traditional Javanese house type, often tied to the households of the nobility. Its form joins structure, ritual and climate response.",
secs:[["Structure","The roof is carried by four central columns called soko guru, with a raised central roof section above. Above them, layered timber brackets called tumpang sari form a distinctive ceiling. Joints are typically carved timber, without nails."],["Spatial organisation","Spaces move from public to private: an open pavilion (pendopo) at the front, a transitional area, and the inner house (dalem) with senthong, the more private rooms at the rear. The layout expresses social hierarchy."],["Climate response","High roofs and open sides allow hot air to rise and breezes to pass. Wide eaves keep out sun and heavy rain."],["Contemporary reading","Designers reinterpret Joglo in modern homes through open plans, double-height roofs and timber structure. Copying ornament without understanding the logic loses its meaning."]],
terms:[["Soko guru","The four main central columns of a Joglo."],["Pendopo","Open front pavilion for receiving guests."],["Tumpang sari","Layered timber brackets under the central roof."]],
app:"Compare a Joglo section with a modern air-conditioned room. List three passive cooling ideas you could keep.",
mist:["Treating it as only a decorative style","Ignoring the public-private sequence"],
ex:"Draw a simple plan of a Joglo from a reliable source and label pendopo, dalem and senthong. Cite your source.",
q:[["Soko guru are:",["Roof tiles","Four main central columns","Windows","Doors"],1,"They carry the central roof."],
["A pendopo is:",["A bedroom","An open front pavilion","A kitchen","A bathroom"],1,"It receives guests and marks the public zone."],
["The high Joglo roof helps by:",["Trapping heat","Letting hot air rise and shading","Blocking wind","Adding weight"],1,"It supports ventilation and shade."]],
chk:"You can explain the Joglo's structure, spatial sequence and climate logic."}

"2-2":{obj:["Tell plans, elevations and sections apart","Explain what each shows and hides"],
intro:"Interior designers think in three flat views to describe a three-dimensional room. Each view answers different questions.",
secs:[["Floor plan","A plan is a horizontal cut through the room, usually about 1.0 to 1.5 m above the floor, looked at from above. It shows walls, openings, furniture positions and sizes, and circulation."],["Elevation","An elevation is a straight-on view of a vertical surface, such as one wall. It shows heights, cabinet layouts, window positions and finishes, but not depth."],["Section","A section is a vertical slice through the room. It reveals ceiling heights, level changes, wall thickness and relationships between floors."],["Using them together","Plans locate things, elevations describe surfaces, sections explain height and construction. A thick line usually marks cut elements; thinner lines show what lies beyond."]],
terms:[["Cut line","Heavy line marking where a plan or section slices through."],["Orthographic view","Flat view with no perspective distortion."]],
app:"Choose a bookshelf wall in your home. Sketch its plan position and its elevation.",
mist:["Expecting a plan to show heights","Confusing elevation with the height of a building only"],
ex:"Draw a plan, one elevation and one section of a simple room, labelling the cut lines.",
q:[["Which view best shows cabinet heights on one wall?",["Plan","Elevation","Site plan","Roof plan"],1,"Elevations show vertical surfaces straight on."],
["A plan is cut at roughly:",["Floor level","1.0-1.5 m above floor","Ceiling","Roof"],1,"Cutting there shows windows and furniture."],
["A section reveals:",["Only colours","Heights and vertical relationships","Only furniture brands","Nothing"],1,"It is a vertical slice."]],
chk:"You can name the right view for any question about a room."},
"2-4":{obj:["Divide a space into zones","Plan clear circulation routes"],
intro:"A well-planned layout puts activities in sensible places and links them with clear paths.",
secs:[["Zoning","Group activities into public (living, dining), private (sleeping, bathing) and service (kitchen, storage, laundry) zones. Place noisy zones away from quiet ones."],["Adjacency","Some rooms belong together, such as kitchen and dining. A quick bubble diagram of rooms and links helps test options before drawing."],["Circulation","Circulation is the routes between spaces. Main paths should be about 900 mm wide or more. Paths that cut through seating or work areas feel awkward."],["Testing","Trace daily journeys, such as bed to bathroom or entrance to kitchen with shopping, and look for detours and bottlenecks."]],
terms:[["Bubble diagram","Quick sketch of rooms and links."],["Adjacency","Which spaces should sit next to each other."]],
app:"Trace your morning routine on a plan of your home and mark any crossings or detours.",
mist:["Putting a path through the middle of a seating group","Ignoring noise between zones"],
ex:"Draw a bubble diagram for a small apartment with public, private and service zones.",
q:[["A kitchen is usually in the:",["Private zone","Service zone","Public hall","Roof"],1,"It supports household services."],
["A main path should be about:",["300 mm","900 mm or more","50 mm","Irrelevant"],1,"This allows comfortable passing."],
["A bubble diagram shows:",["Materials","Room relationships","Colours","Costs"],1,"It tests adjacencies early."]],
chk:"You can zone a plan and keep circulation clear."},
"2-5":{obj:["Arrange furniture for use and conversation","Apply common clearance dimensions","Apply basic ergonomics"],
intro:"Furniture sets how a room is used. Ergonomics ties its dimensions to the human body.",
secs:[["Living areas","Seating groups work best when people can talk without shouting, often within about 2.4 to 3 m. Leave about 400-450 mm between sofa and coffee table, and keep paths open around the group."],["Dining","Allow about 600 mm of table width per person and about 900 mm behind chairs for passing. Typical table height is about 750 mm and seat height about 450 mm."],["Work","Desks are commonly 720-750 mm high. Screens at eye level, feet supported and forearms level reduce strain."],["Accessibility","A wheelchair user needs roughly 1.5 m for turning, and clear door widths. Check local standards for exact requirements."]],
terms:[["Ergonomics","Fitting design to the human body."],["Clearance","Free space left around an object."]],
app:"Measure your dining table and chairs. Is there 900 mm behind each chair?",
mist:["Pushing all furniture against walls","Ignoring chair pull-out space"],
ex:"Draw a living room at 1:50 and place furniture with the clearances above. Test two layouts.",
q:[["A common dining table height is:",["450 mm","750 mm","1200 mm","300 mm"],1,"Around 750 mm suits seated dining."],
["Space behind a dining chair should be about:",["100 mm","900 mm","3 m","None"],1,"This allows people to pass."],
["Ergonomics concerns:",["Colour theory","Fit between people and design","Wall paint","Roof pitch"],1,"It tailors design to the body."]],
chk:"You can place furniture with correct clearances."},
"3-3":{obj:["Recognise rhythm types","Use repetition without monotony"],
intro:"Rhythm moves the eye through a space using repeated or varied elements, like beats in music.",
secs:[["Repetition","The same element repeated at regular intervals: a row of pendants, evenly spaced columns, or a sequence of arches."],["Alternation","Two elements swapped in turn, such as light and dark panels."],["Progression","Elements change gradually in size or colour, such as stairs or graduated vases."],["Avoiding monotony","Too much repetition feels dull. Break it with a pause, a larger element or a change of material."]],
terms:[["Rhythm","Pattern of repetition guiding the eye."],["Progression","Gradual change in a sequence."]],
app:"Look down a corridor you know. Which elements repeat?",
mist:["Repeating everything equally","Spacing elements randomly"],
ex:"Design a hallway wall with three types of rhythm and photograph or sketch each.",
q:[["Evenly spaced pendants show:",["Repetition","Contrast","Emphasis","Unity only"],0,"The same element repeats."],
["Progression means:",["Identical objects","Gradual change in a sequence","Random order","One object"],1,"Size or tone shifts step by step."],
["Too much repetition causes:",["Interest","Monotony","Balance","Hierarchy"],1,"It becomes dull."]],
chk:"You can build and control rhythm in a room."},
"3-4":{obj:["Create contrast on purpose","Keep harmony while contrasting"],
intro:"Contrast adds interest; harmony gives calm. Good interiors use both.",
secs:[["Kinds of contrast","Light against dark, rough against smooth, curved against straight, large against small."],["Harmony","Harmony comes from shared qualities: a limited palette, repeated shapes, a common material."],["Balancing both","A rule of thumb is to let one quality unify the room and add contrast in a few controlled places, such as a dark rug in a pale room."],["Too much of either","All contrast is chaotic; all harmony is bland."]],
terms:[["Contrast","Strong difference between elements."],["Harmony","Agreeable relationship between elements."]],
app:"Choose a room and note one source of unity and one source of contrast.",
mist:["Contrasting everything","Choosing a bland room without any accent"],
ex:"Make a material board with harmony and then add one contrasting element.",
q:[["Rough stone against smooth plaster is:",["Texture contrast","Harmony","Rhythm","Scale"],0,"Different textures contrast."],
["Harmony usually comes from:",["Random choice","Shared qualities","Maximum difference","Size only"],1,"Colours or shapes repeat."],
["All contrast leads to:",["Calm","Chaos","Unity","Balance"],1,"Nothing rests the eye."]],
chk:"You can combine harmony and contrast deliberately."},
"3-5":{obj:["Create unity","Define a focal point","Build visual hierarchy"],
intro:"Unity makes a room feel like one design. Emphasis and hierarchy tell the eye what to notice first, second and last.",
secs:[["Unity","Repeat a colour, material or shape across zones so the room reads as a whole."],["Emphasis","A focal point such as a fireplace, art or a feature wall draws attention. Create it with contrast, size or position."],["Hierarchy","Rank elements: primary focal point, secondary features, then background. Competing focal points confuse the eye."],["Supporting the focal point","Arrange seating toward it and keep surrounding elements quieter."]],
terms:[["Focal point","The element that draws attention first."],["Hierarchy","Ranking of elements by importance."]],
app:"Squint at a photo of a room. What stands out first?",
mist:["Several equal focal points","A focal point nobody faces"],
ex:"Choose a room and rank its five most visible elements. Redesign to strengthen one.",
q:[["A focal point is created by:",["Contrast, size or position","Silence","Repetition only","None"],0,"These draw attention."],
["Competing focal points:",["Help","Confuse the eye","Add unity","Remove hierarchy"],1,"The eye cannot rest."],
["Unity is built by:",["Repeating a colour or material","Changing everything","Removing furniture","Using dark colour only"],0,"Repetition links zones."]],
chk:"You can set a clear hierarchy in a room."},
"4-3":{obj:["Define complementary and analogous palettes","Choose one for a mood"],
intro:"Relationships on the colour wheel give reliable palettes.",
secs:[["Complementary","Colours opposite on the wheel, such as blue and orange, create strong contrast. Use one as dominant and the other as accent."],["Analogous","Neighbouring colours, such as yellow, yellow-green and green, give calm, cohesive rooms."],["Variations","Split-complementary uses a hue and the two neighbours of its opposite; it softens contrast."],["Using them","Tone down saturation in large areas and save the vivid version for small accents."]],

"4-4":{obj:["Define saturation and value","Use value contrast for legibility"],

["Greyscale testing checks:",["Texture","Value contrast","Hue name","Cost"],1,"It removes colour so only value remains."]],
chk:"You can adjust saturation and value deliberately."},
"4-5":{obj:["Treat colour psychology as tendency, not rule","Follow a palette development process"],
intro:"Colours influence mood, but responses vary with culture, personal history and context, so treat psychology as a guide.",
secs:[["Common associations","Blues and greens are often linked with calm; warm yellows and oranges with energy and sociability; deep reds with intensity. These are tendencies, not guarantees."],["Context","Light, material, scale and culture change meaning. Always ask the user what colours mean to them."],["Palette process","1) Read the brief and mood. 2) Gather inspiration. 3) Choose base neutrals for large surfaces. 4) Add one or two secondary colours. 5) Add accent. 6) Include fixed items such as floors and wood. 7) Test samples in the room."],["Review","Check the palette in daylight and artificial light, and in greyscale for value."]],

app:"Describe the mood you want in your study in three words, then pick a palette for it.",

q:[["Colour psychology is best treated as:",["Absolute law","General tendency","Irrelevant","Legal rule"],1,"Responses vary with culture and context."],
["Which comes first in palette development?",["Buying paint","Understanding the brief","Accent selection","Rendering"],1,"The brief sets mood and goals."],
["Fixed elements to include are:",["Existing floors and wood","Only cushions","Nothing","Future paint"],0,"They already contribute colour."]],
chk:"You can develop and justify a palette."},
"5-2":{obj:["Compare bamboo and rattan","Know their limitations"],
intro:"Bamboo and rattan are fast-renewing natural materials strongly linked to tropical design.",
secs:[["Bamboo","Bamboo is a grass, not a tree. It grows quickly and is strong along its length. Raw culms need treatment against insects and moisture. Engineered bamboo (laminated strips) is used for flooring, panels and furniture."],["Rattan","Rattan is the cane of a climbing palm. It is lightweight and flexible, so it can be bent and woven. The outer skin is used for weaving and the core for frames and wicker. Indonesia is a major rattan producer."],["Properties","Both are light, textured and warm in appearance. Both can be damaged by prolonged moisture, sun and insects unless protected."],["Applications","Screens, ceilings, pendant shades, furniture, wall panels and accessories. Use sealed finishes where cleaning is frequent."]],
terms:[["Culm","The stem of a bamboo plant."],["Wicker","Woven furniture made from cane or similar fibre."]],
app:"Find a rattan or bamboo item at home or in a shop and note its weave or joints.",
mist:["Assuming natural means maintenance-free","Using untreated bamboo outdoors"],
ex:"Compare bamboo, rattan and timber in a table: weight, strength, durability, maintenance and sustainability.",
q:[["Bamboo is botanically a:",["Tree","Grass","Palm","Shrub"],1,"It belongs to the grass family."],
["Rattan is the cane of a:",["Climbing palm","Tree","Bush","Vine grape"],0,"It is a palm."],
["Bamboo needs treatment mainly against:",["Cold","Insects and moisture","Noise","Colour"],1,"These cause decay."]],
chk:"You can pick bamboo or rattan appropriately."},
"5-3":{obj:["Compare common stones","Describe concrete finishes","State their limitations"],
intro:"Stone and concrete bring weight, permanence and cool texture, but need careful detailing.",
secs:[["Natural stone","Granite is very hard and dense. Marble is softer and can be etched or stained by acids. Limestone and travertine are porous and need sealing. Each slab varies in pattern."],["Engineered stone","Quartz composites are made from crushed stone and resin. They are consistent and stain resistant, but can be damaged by high heat."],["Concrete","Concrete can be a polished floor, cast furniture or a feature wall. It is durable and heavy, and may crack, stain or feel cold and noisy without soft layers."],["Considerations","Check weight against the structure, slipperiness when wet, and sealing. Pair with soft materials to control echo."]],

app:"Compare a granite and a marble sample. Which scratches or stains more easily?",

ex:"Make a table comparing granite, marble, limestone, quartz and concrete for hardness, porosity and cost.",
q:[["Which stone is most prone to acid etching?",["Granite","Marble","Quartz","Concrete"],1,"Marble reacts with acids."],
["Porous stone needs:",["Sealing","Heating","Paint only","Nothing"],0,"Sealing reduces staining."],
["Concrete interiors often need:",["Soft elements for acoustics","More echo","Nothing","Glass only"],0,"Hard surfaces reflect sound."]],

"5-4":{obj:["Distinguish glass types","Compare ceramic and porcelain","Describe metal finishes"],
intro:"Glass, metal and ceramics provide light, structure, durability and detail.",
secs:[["Glass","Annealed glass breaks into sharp shards. Tempered (toughened) glass is stronger and breaks into small pieces. Laminated glass holds together when broken. Coated low-e glass reduces heat gain."],["Metals","Stainless steel resists corrosion; aluminium is light; brass and copper develop patina; mild steel rusts unless coated. Finishes include brushed, polished and powder-coated."],["Ceramics","Ceramic tiles are fired clay. Porcelain tiles are denser with very low water absorption, so suit wet areas and heavy traffic. Grout lines need sealing and cleaning."],["Selection","Match safety, moisture, hygiene and maintenance to the location."]],
terms:[["Tempered glass","Heat-treated safety glass."],["Patina","Surface change developed over time."]],
app:"List the glass, metal and ceramic items in a bathroom and name the likely type of each.",
mist:["Using ordinary glass where safety glass is required","Ignoring slip resistance of tiles"],

["Mild steel rusts unless:",["Coated","Polished","Heated","Left alone"],0,"Coatings protect it."]],

"5-5":{obj:["Compare natural and synthetic fibres","Interpret durability and care information"],
intro:"Soft finishes add warmth, comfort and sound absorption, but wear differently from hard materials.",
secs:[["Natural fibres","Cotton and linen breathe and feel natural, but crease or fade. Wool is resilient and warm. Silk is delicate."],["Synthetic fibres","Polyester and nylon are strong, stain resistant and affordable but may feel less breathable. Blends combine qualities."],["Durability","The Martindale rub test rates abrasion resistance; higher numbers last longer. Domestic upholstery often needs roughly 15,000 or more, and heavy use more. Also check colourfastness and fire requirements."],["Care","Check cleaning codes, removable covers and fading in strong sun."]],

["Fading is a risk where:",["Sun is strong","Always","Never","Only on floors"],0,"UV fades fibres and dyes."]],

"6-4":{obj:["Distinguish lumens and lux","Spot and reduce glare","Use shadows deliberately"],

secs:[["Measuring light","Lumens measure a lamp's total output. Lux measures light falling on a surface (lumens per square metre). Typical guidance is around 100-200 lux for living areas and 300-500 lux for desks; check local standards."],["Glare","Direct glare comes from bright sources in view; reflected glare from shiny surfaces and screens. Reduce with diffusers, shielding, indirect light and matte finishes."],["Shadows","Soft shadows feel gentle; hard shadows are dramatic. Avoid harsh shadows on faces and work surfaces."],["Balance","Avoid extreme brightness differences between a task and its surroundings."]],

["Glare is reduced by:",["Diffusers and shielding","Bare bulbs","Gloss","Mirrors"],0,"They spread or hide the source."],
["Hard shadows feel:",["Soft","Dramatic","Absent","Cool"],1,"Sharp edges add drama."]],

"6-5":{obj:["Combine layers into a lighting scheme","Light surfaces, not just floors"],

app:"Sketch a light plan for your living room with three scenes.",

["Pools of light create:",["Flatness","Depth and focus","Glare","Heat"],1,"They add contrast."],
["A scene is:",["A saved combination of settings","A painting","A bulb","A switch"],0,"It recalls light levels."]],

"7-1":{obj:["Tell structural walls from partitions","Compare common wall systems","Understand sound and fire basics"],

secs:[["Structural or not","Load-bearing walls carry floors or roof above and need an engineer's approval to alter. Partitions only divide space. Never assume; verify with drawings and a professional."],["Systems","Brick and aerated concrete blocks are masonry, heavy and durable. Drywall is gypsum board on metal or timber studs, light and quick. Glass partitions share light but give less privacy and sound control."],["Sound and fire","Sound insulation comes from mass, an air gap, and sealing all gaps. Fire-rated walls are required in some building types; check local codes."],["Finishes","Paint, plaster, tile, timber panels or wallpaper. Choose moisture-resistant finishes in wet areas."]],

q:[["Load-bearing walls:",["Carry structural loads","Are always glass","Are decorative","Can be removed freely"],0,"They support building loads."],
["Drywall is:",["Gypsum board on framing","Stone","Concrete","Glass"],0,"It is a lightweight system."],
["Sound insulation improves with:",["Mass and sealed gaps","Larger gaps","Thin boards only","Open joints"],0,"Density and sealing reduce transmission."]],

"7-2":{obj:["Compare flooring materials","Understand ceiling types and heights"],
intro:"Floors take daily wear and ceilings shape the sense of height and light.",
secs:[["Flooring","Tile is durable and easy to clean but hard and cold. Timber is warm but sensitive to moisture. Vinyl is practical and soft. Polished concrete is seamless. Carpet absorbs sound. Choose slip resistance for wet areas."],["Comfort and care","Consider thermal feel, noise underfoot, cleaning and repair. An underlay or screed may be needed beneath finishes."],["Ceilings","Common heights are around 2.4 to 3 m. Gypsum false ceilings hide services and allow cove lighting; exposed ceilings give height but show pipes."],["Perception","Lower ceilings feel cosy, higher ones grand. Light colours raise the ceiling visually."]],

["Carpet is good for:",["Absorbing sound","Wet areas","Heat reflection","Outdoor use"],0,"Soft fibres reduce noise."],
["Light ceilings tend to:",["Feel higher","Feel lower","Absorb light","Be unsafe"],0,"They reflect more light."]],

"7-3":{obj:["Compare door and window types","Plan swing and ventilation"],
intro:"Doors and windows control movement, light, air and view, and each type has space implications.",
secs:[["Doors","Swing doors need clearance for the arc. Sliding doors save floor space, pocket doors vanish into the wall, folding doors open wide. Clear opening widths around 850-900 mm are commonly recommended; heights are often about 2.1 m."],["Windows","Casement windows open outward fully for ventilation. Sliding windows are simple but open only half. Awning windows allow ventilation in rain. Fixed windows give light and view only."],["Placement","Place windows for cross-ventilation and views, doors where they do not collide with furniture."],["Details","Consider hardware, thresholds, seals and safety glass near floors."]],
terms:[["Swing","Arc a door sweeps when opened."],["Cross-ventilation","Air flow between opposite openings."]],
app:"Check which doors in your home collide with furniture or each other.",
mist:["Doors blocking furniture","Windows opposite blank walls without airflow"],
ex:"Draw a room plan with door swing arcs and two window options.",
q:[["Sliding doors save:",["Floor space","Light","Air","Cost"],0,"They need no swing arc."],
["Casement windows:",["Open outward fully","Never open","Only slide","Are fixed"],0,"They hinge at the side."],
["Cross-ventilation needs:",["Two openings","One opening","None","A wall"],0,"Air passes between openings."]],
chk:"You can place and choose doors and windows."},
"7-4":{obj:["Apply anthropometrics","Recognise basic furniture construction"],
intro:"Furniture design starts with the body and ends with construction that survives use.",
secs:[["Anthropometrics","Anthropometrics is the study of body measurements. Designers use ranges, such as the 5th to 95th percentile, so most people fit comfortably."],["Dimensions","Seat height about 450 mm, depth about 400-450 mm, with back support. Reach, eye height and clearance also matter."],["Construction","Joints include mortise and tenon, dowels and dovetails. Metal and plywood use fasteners and welds. Check stability against tipping."],["Material choice","Match material to load, moisture and finish."]],

["A mortise and tenon is a:",["Wood joint","Paint","Glass","Fabric"],0,"It is a classic joint."]],

"7-5":{obj:["Plan built-in storage","Use standard depths and heights"],
intro:"Built-in furniture fits a room precisely and can use awkward space well, but it must be planned carefully.",

["Carcass means:",["Cabinet box","Door","Handle","Finish"],0,"It is the main structure."]],

"8-1":{obj:["Explain the diversity of Indonesian architecture","Identify shared climate responses"],
intro:"Indonesia spans thousands of islands and hundreds of cultures, so there is no single Indonesian architecture. There are many traditions with shared responses to climate and community.",
secs:[["Diversity","Each region, such as Java, Bali, Toraja and Minangkabau, has its own forms, materials and meanings shaped by religion, social structure and environment."],["Climate response","Many traditions use raised floors, large overhanging roofs, open sides and cross-ventilation to handle heat, rain and humidity."],["Social meaning","Houses express kinship, rank, ritual and community, not only shelter."],["Reading it carefully","Avoid reducing it to motifs. Ask what a form does and what it means to its community."]],

["Adat refers to:",["Custom and tradition","A material","A tool","A roof"],0,"It is customary practice."]],
chk:"You can describe the diversity and shared logic of Nusantara building."},
"8-3":{obj:["Explain the Balinese compound","Describe orientation and sacred hierarchy"],
intro:"Traditional Balinese architecture is rooted in Hindu-Balinese belief and organises homes as walled compounds of separate pavilions.",
secs:[["Philosophy","Tri Hita Karana is the idea of harmony among people, nature and the divine. It guides how buildings are placed."],["Compound","A family compound has a wall, a gate and individual pavilions (bale) for sleeping, meeting, cooking and ceremonies, arranged around open courtyards. A screen wall (aling-aling) behind the gate blocks direct view and, in belief, unwanted spirits."],["Orientation","Spaces are placed along axes: kaja (toward the mountain) is more sacred and kelod (toward the sea) less so. The family shrine usually sits in the most sacred corner."],["Materials and climate","Timber, bamboo, thatch, brick and stone. Open pavilions and courtyards give shade and breeze."]],
terms:[["Bale","Open pavilion within a compound."],["Aling-aling","Screen wall behind the entry gate."]],
app:"Sketch a simplified Balinese compound plan and mark the sacred corner.",
mist:["Reducing it to carved decoration","Ignoring orientation rules"],
ex:"Draw a compound diagram with gate, aling-aling, bale and shrine, citing a reliable source.",
q:[["Tri Hita Karana means:",["Harmony of people, nature and divine","A roof type","A tool","A colour"],0,"It is a guiding philosophy."],
["Aling-aling is:",["Screen behind the gate","A roof","A bed","A tool"],0,"It blocks the direct view."],
["Kaja is toward the:",["Mountain","Sea","Sky","West"],0,"It is the more sacred direction."]],
chk:"You can read a Balinese compound's logic."},
"8-4":{obj:["Describe the Tongkonan and Rumah Gadang","Compare their form and social meaning"],

secs:[["Tongkonan (Toraja)","A raised timber house from South Sulawesi with a boat-like saddle roof, carved and painted panels and a ridge curving up at each end. It is tied to ancestral lineage and ritual, and is often aligned north-south. Rice barns face the house."],["Rumah Gadang (Minangkabau)","From West Sumatra, built on stilts with sweeping roof gables (gonjong). Minangkabau society is matrilineal, and the house is associated with the female line and extended family."],["Shared lessons","Both use timber, raised floors, deep roofs and carved meaning. Their forms are tied to society, not decoration."],["Differences","Tongkonan roofs curve like a saddle, while Rumah Gadang roofs rise to multiple pointed gables."]],

chk:"You can tell the two traditions apart and explain why."},

["Level 5: Model organization","Purpose: keep a model editable and accurate. Groups isolate geometry, components are reusable linked copies, tags control visibility, and the Outliner shows the model's hierarchy.",["Select geometry, right-click, choose Make Group or Make Component (Make Component is G).","Double-click a group to edit it; click outside to close it.","Open the Tags panel in the tray to create tags such as Shell, Furniture and Lighting, and assign objects.","Open the Outliner to rename and find objects.","Use the Tape Measure (T) to confirm key dimensions."],"G = Make Component, T = Tape Measure.","Organise a room model into Shell, Furniture and Lighting tags, with every chair as the same component.","Leaving loose geometry; inconsistent names; editing a component when you meant to edit a copy.","Clean tags, named groups, and a model that edits without sticking."],

const ANN={3:["Sanggah (family shrine) in the mountain-ward east corner, the most sacred position.","Sleeping and meeting pavilions (bale daja, bale dauh, bale dangin) stand separately around open yards.","Kitchen (paon) and granary (jineng) lie toward the sea-ward side.","Entrance gate (angkul-angkul) with the aling-aling screen wall behind it, so passers-by cannot see straight in.","This is a typical commoner layout from secondary sources. Layouts and entrance positions vary."],0:["Brunjung: the raised central roof, with a very short ridge (mala) at the top.","Penanggap and penitih: the lower surrounding roofs; the roof reads as three stepped parts.","Soko guru: four main posts carrying the roof directly. Walls are not structural. This is a cut-away, so the roof is translucent.","Pendopo: open roofed hall at the front of the compound.","Umpak: stone bases under the posts. Tumpang sari (stacked beams above the posts) is drawn with five levels; sources cite five, seven or nine."],1:["Gonjong: upswept horn-like roof peaks. Their number varies by house (two to fourteen in one survey). Four are shown as an illustrative composition. Roofing was traditionally ijuk (sugar palm fibre).","Boat-like body that widens upward; upper walls lean outward in some regional types (lean exaggerated slightly for legibility). Carved panels and shuttered windows are shown schematically, without real motifs.","Raised floor on timber posts that rest on flat stones instead of being buried.","Stair, often placed centrally and facing the front in the type drawn here."],4:["Boat-shaped saddleback roof with upswept ends, traditionally layered bamboo. Proportions are simplified; the roof ends are drawn symmetrical.","Carved and painted wall panels, commonly in red, black, yellow and white. Motifs are schematic here.","Tall timber piles set on stones, with mortised tops holding the tie beams. Traditionally oriented north-south with the front gable north; a rice barn (alang) stands opposite, not shown."]};

0:{s:"Researched (web sources). Drawing revised.",v:"Roof in three parts (brunjung, penanggap, penitih) with a very short ridge; tumpang sari stacked in 5, 7 or 9 levels; four soko guru carry the roof, walls are non-structural; sunduk and kili stabilise the posts; pendopo at front, dalem with senthong behind.",r:"Joglo is a roof type used for houses, pendopo and mosques. Level counts and proportions vary by house and by period.",u:"Exact timber species, joinery detail and the symbolic meaning of each level need a scholarly source. Teak and sacred-space claims come from secondary sources.",src:[["Joglo House structure and layout (EUDL conference paper)","https://eudl.eu/pdf/10.4108/eai.8-12-2018.2283855"],["Saka guru (encyclopedia, cites scholarly sources)","https://www.wikipedia.org/wiki/Soko_guru"]]},
1:{s:"Researched (web sources). Drawing revised.",v:"Truss and cross-beam roof with ijuk thatch; gonjong peaks; walls carry carved relief and shuttered windows; raised floor on posts resting on flat stones; posts leaning 91-94 degrees in one documented method; separate rangkiang rice barns.",r:"Koto Piliang type has raised end floors (anjuang); Bodi Caniago has a flat floor. Some localities have vertical front and rear posts and flatter ridges; others have curved ridges and outward-leaning posts. Gonjong count varies.",u:"Rank meanings tied to gonjong counts differ between sources. Specific carving motifs and colours were not reproduced. Overall dimensions need a measured survey.",src:[["Rumah Gadang (encyclopedia)","https://en.wikipedia.org/wiki/Rumah_Gadang"],["Traditional builders and construction method (Teorema journal)","https://jurnal.unigal.ac.id/teorema/article/download/1069/970"],["Form of the house body (Jurnal Desain)","https://journal.lppmunindra.ac.id/index.php/Jurnal_Desain/article/download/8124/3617"],["Regional variants and carving (Serupa, UNP)","https://ejournal.unp.ac.id/index.php/serupa/article/download/5619/4414"]]},

0:[["Roof structure","The roof reads as three stepped parts: the raised brunjung, and the lower penanggap and penitih. A very short ridge (mala) sits at the top. Beneath the brunjung, tumpang sari stacks beams in five, seven or nine levels, stepping inward as they rise."],["Structural system","Four main posts, the soko guru, support the roof directly. Walls only bound rooms and carry no roof load. Sunduk and kili tie members stabilise the posts, and posts stand on stone bases (umpak)."],["Spatial organization","From front to back: the open pendopo, the pringgitan, then the dalem (main house) with the senthong rooms. Gandhok are side houses. The zone beneath the tumpang sari is described as sacred."],["Cultural significance","The number of tumpang sari levels is reported to indicate status, and the structure is read through Javanese cosmology. Treat the symbolic readings as interpretation."]],
1:[["Roof structure","Truss and cross-beam construction, traditionally covered in ijuk (sugar palm fibre) laid in bundles that follow the curves. The gonjong are the horn-like peaks; the singok is the triangular wall below their ends."],["Structural system","Timber posts (tonggak) stand on flat stones (batu sandi) instead of being buried, and are linked by lower and upper beams. One documented method leans the posts 91-94 degrees, giving a boat-like body that widens upward."],["Spatial organization","A long hall organised by rows of posts. The number of rooms follows the number of married women. Koto Piliang houses have raised end floors (anjuang); Bodi Caniago houses have one level. Cooking and storage are often in separate buildings, and rangkiang rice barns stand in front."],["Cultural significance","Matrilineal society: the house belongs to the women of the family and passes from mother to daughter. The gonjong are said to represent buffalo horns."]],

4:[["Roof structure","A boat-shaped saddleback roof with dramatically upswept ends dominates the house. It was traditionally layered bamboo; zinc is common today. The interior is small compared with the roof."],["Structural system","Large vertical piles on stones, with mortises in their tops for horizontal tie beams. Joints were traditionally tongue-and-groove, without nails. Floors are wooden boards on thin hardwood joists."],["Spatial organization","Oriented north-south with the front gable to the north. Typically three rooms: a small north guest room, a central living room and a south sleeping room, with the end floors slightly higher. Few windows. A rice barn (alang) stands opposite."],["Cultural significance","The ancestral house of a Torajan family and a symbol of family identity. A buffalo head may mark the north end. Interpretations of the roof's boat shape vary between sources."]]};

["Japanese: the tatami room","Japan","Traditional, from earlier periods; modern adaptations","Rooms built on a modular grid, with sliding screens, low furniture and one alcove for a single displayed object.","Tatami, timber, paper screens, plaster, bamboo","Modular proportion, flexible rooms, restraint, a link to the garden","How tatami mats set room size, how paper screens soften light, and how the alcove holds one focal object.","Flexible multi-use rooms, a single focal point and diffused light.",
[["Defining characteristics","Room sizes are counted in tatami mats, a rectangular mat about twice as long as it is wide, so plans follow a module. Sliding screens (fusuma and shoji) let rooms join or separate. Furniture is low and stored away when not in use. A tokonoma alcove displays a single scroll or arrangement."],["Materials and palette","Natural, low-saturation tones: straw tatami, pale and dark timber, white paper and earth-coloured plaster. Surfaces are left honest, with grain showing."],["Light and atmosphere","Paper screens spread daylight into a soft, even glow with few hard shadows. The mood is quiet and still."],["Using it today","Set furniture and openings on a module, add sliding or translucent screens for flexible rooms, lower seating, and keep one focal point. Adapt with respect: tatami rooms carry customs, such as removing shoes."]],
[["Katsura Imperial Villa, Kyoto","17th century; screens, tatami and garden views"],["Japanese tea house (chashitsu)","A small room designed around one ritual"]],["#CFCB9C","#F5F2EA","#8A6A45","#3b4a6b"],"Quiet, still",sJ,["Shoji screens: a lattice of timber and paper that diffuses light.","Tokonoma alcove: one scroll and one arrangement.","Paper lantern over a low table: light at the height of use."],"Tatami room with shoji screens, a tokonoma alcove, a low table and a paper lantern"],
["Tropical: the open garden room","Indonesia and Sri Lanka","Modern interpretations of traditional climate response","Open, shaded rooms that use cross-ventilation, deep eaves and natural materials to live comfortably in heat and humidity.","Timber, bamboo, rattan, stone, terracotta","Cross-ventilation, shade, indoor-outdoor continuity, craft","How openings line up for airflow, where light is filtered, and how a courtyard brings daylight deep inside.","Design for climate first, use natural materials that breathe, and blur inside and outside.",
[["Defining characteristics","Rooms open to verandas, courtyards and gardens, and openings are aligned so air passes through. High ceilings let hot air rise, and exposed timber beams show the structure. Louvres and screens control light and privacy. Rattan and bamboo make light furniture and lamps."],["Materials and palette","Warm timber, terracotta and stone with leaf green. Pale or lime-washed walls reflect light."],["Light and atmosphere","Shaded and filtered. Deep eaves reduce glare and courtyards give bright pockets. The mood is relaxed and airy."],["Using it today","Align openings for a breeze, use fans and louvres before air-conditioning, choose materials that tolerate humidity, and treat a planted corner as a room."]],

[["Defining characteristics","Open plans, large glass walls and furniture made in new materials such as moulded plywood, fibreglass and steel rod. Pieces have organic curves and slim legs, so floors stay visible. Manufactured furniture sits beside personal collections."],["Materials and palette","Warm teak or walnut with white, plus accents such as orange, mustard or teal."],["Light and atmosphere","Daylight through glass walls, with table, floor and pendant lamps for evening. The mood is optimistic and playful."],["Using it today","Combine one or two classic pieces with plain walls, keep legs and floors visible, and add collected objects so the room feels lived in."]],
[["Eames House (Case Study House No. 8), Pacific Palisades","1949; a home and studio filled with collected objects"],["Farnsworth House, Plano, Illinois","Mies van der Rohe, 1951; a glass-walled single room"],["Eames Lounge Chair","1956; moulded plywood and leather"]],["#C9A27A","#B97D4C","#2F6F73","#D8742B"],"Playful, optimistic",sM,["Timber wall with a sunburst clock: warmth and a focal point.","Low sideboard on slim legs: storage that keeps the floor visible.","Lounge chair in a bold accent colour."],"Mid-century living room with teak wall, sunburst clock, sideboard, teal sofa and orange lounge chair"],

[["Defining characteristics","Few objects, concealed storage and a limited palette. With little to hide behind, joints, shadow gaps and thresholds are resolved carefully. Daylight is shaped as a material."],["Materials and palette","Raw concrete, plaster, pale stone and timber in whites, greys and soft earth tones."],["Light and atmosphere","A cut or slot of daylight becomes the main feature. The mood is calm and contemplative."],["Using it today","Remove before adding, give each object space, hide storage, and spend budget on materials and junctions. Add texture and warm light so the space stays humane."]],

[["Defining characteristics","Pale timber floors, white walls and large windows to use scarce daylight. Furniture is curved and crafted, often in solid wood or plywood. Light is layered with lamps at several heights."],["Materials and palette","White, soft grey and pale birch or ash, with muted blues and greens and wool textiles."],["Light and atmosphere","Soft low-angle light is spread by pale surfaces and sheer curtains. In the evening, several warm lamps make the room cosy."],["Using it today","Maximise daylight, layer three or more lamps at different heights, add wool and timber for texture, and keep forms practical."]],

["Javanese joglo: the layered ceiling","Java, Indonesia","Traditional; still built and adapted today","A raised pavilion-house whose interior is organised under a stacked timber ceiling held up by four central columns.","Teak (jati), carved timber partitions, clay roof tiles, polished stone or tile floors","Hierarchy of rooms from open to private, structure shown as decoration, shade and airflow","How the four columns frame the centre, how the stepped ceiling draws the eye up, and how rooms get more private toward the back.","Let structure be the ornament, plan a clear public-to-private sequence, and use one warm timber.",
[["Defining characteristics","Four main columns (soko guru) carry a stepped ceiling called tumpang sari, which rises toward the centre of a high roof. The plan is commonly read as a pendopo (open front pavilion), a pringgitan (transition space) and a dalem (enclosed inner house). Carved timber screens (gebyok) separate the inner house, and a row of small rooms (senthong) lies at the back. The central senthong is often linked to rice and heirlooms, but practice varies."],["Materials and palette","Teak in warm browns and near-black, with touches of gold or deep red on carved or ceremonial elements. Floors are stone, tile or terrazzo; older houses may have had compacted earth."],["Light and atmosphere","The deep eaves keep the open pavilion shaded and cool, with bright light at the edges and a dim, calm inner house. The mood is dignified and still."],["Using it today","Frame a living area with four visible posts or beams, add a stepped or layered ceiling feature, use a carved or slatted timber screen instead of a plain wall, and keep openings aligned for airflow."]],
[["Pendopo Agung, Yogyakarta region","Large open pavilions used for gatherings and performances"],["Joglo houses in Kotagede, Yogyakarta","A historic district with traditional timber houses"]],["#8A6745","#C9A06A","#4a3622","#E2B23B"],"Dignified, still",sJo,["Gebyok screen: a carved timber wall at the back.","Soko guru columns: four posts frame the centre.","Tumpang sari ceiling: stacked layers rising to the roof."],"Javanese joglo interior with four columns, a stepped timber ceiling, a carved screen and a raised platform"],
["Minangkabau Rumah Gadang","West Sumatra, Indonesia","Traditional; matrilineal house form","A long, raised communal house whose interior is a single hall with family rooms along one side and richly carved, painted walls.","Timber, bamboo, carved and painted panels, woven and embroidered textiles","Communal hall, family rooms by lineage, ornament as story","How the single long hall serves gatherings, where the private rooms sit, and how carved wall panels turn structure into pattern.","Make a shared room the heart of the plan, and let one wall carry rich pattern against plainer surfaces.",
[["Defining characteristics","The house is raised on posts and has an upswept, multi-pointed roof (gonjong). Inside is a long open space for gathering, with sleeping rooms along one side or the end. The house belongs to a matrilineal family, and many accounts link the number of rooms to the women of the household. Wall panels carry carved plant motifs."],["Materials and palette","Dark timber with panels painted in red, black and gold-yellow. Songket and other textiles are hung on ceremonial occasions."],["Light and atmosphere","The raised floor and eaves let air pass underneath, and the interior is shaded, with colour glowing on the carved walls. The mood is communal and ceremonial."],["Using it today","Plan one generous shared room, dedicate a feature wall to carved or patterned panels, and use textile hangings for colour that can change."]],
[["Istano Basa Pagaruyung, Tanah Datar","A reconstructed royal Minangkabau palace in the Rumah Gadang tradition"],["Rumah Gadang villages near Padang Panjang","Everyday examples to compare"]],["#8E2A22","#E2B23B","#252724","#8A6745"],"Communal, ceremonial",sRG,["Carved panel wall: plant motifs in red, black and gold.","Textile hanging: colour that changes with the occasion.","Long open hall floor: the shared room."],"Rumah Gadang interior with a red and gold carved wall, a dark platform and a hanging textile"],
["Toraja tongkonan","Tana Toraja, South Sulawesi","Traditional; ceremonial family house","A boat-roofed family house with a small, dim interior and carved wall panels in red, black, yellow and white.","Timber, bamboo, carved and painted boards, thatch or modern roofing","Symbolic ornament, lineage house, compact dark interior","How carved panels read as a coded surface, how the inside is compact and dim, and how the hearth gathers people.","Use a restrained palette of four colours, repeat one motif, and keep a central gathering point.",
[["Defining characteristics","The tongkonan stands on piles under a saddle roof that curves like a boat. The facade and walls carry carved geometric and symbolic motifs. The interior is commonly described in three parts along the house: a north room, a central room and a south room, with the central one used for daily life and gathering. Houses belong to a family line and are tied to rituals."],["Materials and palette","Black ground with red, yellow and white painted carving. The strong contrast makes the geometric pattern readable in low light."],["Light and atmosphere","Small openings keep the interior dim, so the painted panels and a hearth fire stand out. The mood is intimate and weighty."],["Using it today","Pick a four-colour palette, repeat one geometric motif across a wall, and keep other furnishings plain. Treat motifs with care, since many carry specific meanings and are tied to family and ritual."]],
[["Ke'te' Kesu', Rantepao","A heritage village of tongkonan and rice barns"],["Tongkonan houses in Pallawa","Further examples of carved and painted facades"]],["#B2312B","#1f1f1d","#E2B23B","#F2EBDD"],"Intimate, weighty",sTo,["Painted panel wall: one motif repeated in four colours.","Hearth in the centre: where the room gathers.","Plain benches: leave the ornament to the walls."],"Dim Toraja interior with a wall of red, white and yellow geometric panels on black, and a central hearth"],
["Balinese bale and compound","Bali, Indonesia","Traditional; still guides homes and hotels","A family compound of open pavilions (bale) set in a walled courtyard, arranged by sacred direction and function.","Timber, bamboo, thatch (alang-alang), red brick, soft volcanic sandstone (paras)","Orientation, zoning, open pavilions, carved stone and wood","How each pavilion has a role, how the gate and screen wall guard privacy, and how carved stone frames thresholds.","Zone a plan by purpose, use open pavilions for shared life, and concentrate carving at entrances.",
[["Defining characteristics","Rooms are separate pavilions around a courtyard rather than one building. Traditional guidance, often called Asta Kosala Kosali, links layout to directions such as toward the mountain (kaja) or sunrise (kangin). A family shrine is commonly placed in the most sacred corner, and pavilions serve for sleeping, ceremonies, guests and cooking. A gate (angkul-angkul) and screen wall (aling-aling) protect the entrance."],["Materials and palette","Warm timber and thatch with grey carved paras stone and red brick. Gold or red accents appear in ceremonial settings."],["Light and atmosphere","Open sides and deep thatched roofs give shade and breeze, with sunlight in the courtyard. The mood is calm and devotional."],["Using it today","Use open-sided pavilions with a raised plinth for living, thatch or timber for a warm roof, and carved stone or wood at the entrance. Respect religious elements, since the shrine and offerings are sacred."]],
[["Puri Agung Ubud","Palace compound with pavilions and carved gateways"],["Traditional compounds in Penglipuran village","A village with a consistent layout and gateways"]],["#C9A06A","#9d9b93","#6e5236","#E2B23B"],"Calm, devotional",sBa,["Carved stone gate: detail at the threshold.","Raised bale platform: open seating under thatch.","Offering: a small element that is part of daily life."],"Balinese bale pavilion with timber columns, a thatched ceiling, a stone gate and a raised platform"],
["Batik, tenun and carving","Indonesia (Java, Eastern Indonesia, Jepara)","Traditional crafts; used in modern interiors","The crafted layer of Indonesian interiors: wax-resist dyed batik, woven tenun and ikat, and carved timber.","Cotton and silk textiles, natural dyes, teak, mahogany, rattan","Pattern with meaning, craft by hand, accent against plain surfaces","How a single textile or carved piece changes a room, and how patterns repeat to create rhythm.","Use one handmade textile or carved piece as a focal point against calm, plain surroundings.",
[["Defining characteristics","Batik is made by drawing or stamping wax on cloth before dyeing, and UNESCO inscribed Indonesian batik on its heritage list in 2009. Tenun and ikat textiles are woven, with patterns that differ by island and community. Carved furniture, especially from Jepara in Central Java, adds detailed timber relief. Some patterns, such as parang, were historically restricted to royal courts in Java."],["Materials and palette","Indigo blue, soga brown, cream and deep red are common, with natural dyes used in many traditional pieces. Carved teak and rattan add warm neutrals."],["Light and atmosphere","Textiles soften sound and light, so rooms feel layered and warm. Pattern is read up close, so it rewards a calm background."],["Using it today","Hang a batik panel as art, use tenun as a runner or throw, add one carved chest or screen, and keep the walls plain. Buy from makers, and learn what a motif means before using it."]],

["1. The idea","Allen wanted one calm place to learn interior design step by step, with Indonesian homes, climate and materials as part of the story and not an afterthought.","Helped turn a broad goal into a structure: modules, lessons, studio exercises, a library and a glossary.","Chose who the site is for (self-directed learners), the tone, and what it must not claim. That is why it says plainly that it has no accreditation."],
